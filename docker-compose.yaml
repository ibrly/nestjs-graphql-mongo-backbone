version: "3.8"
services:
  backend:
    # dev: the build stage still has devDependencies (nest cli) for watch mode,
    # the final stage does not
    build:
      context: ./
      target: build
    # run the mounted source in watch mode instead of the built dist/main
    command: npm run start:dev
    ports:
      - '3000:3000'
    volumes:
      - ./logs:/app/logs
      - ./:/app
      - /app/node_modules
    env_file:
      - ./app.env